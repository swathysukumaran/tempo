name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  type-check:
    name: TypeScript type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run type check
        working-directory: backend
        run: npx tsc --noEmit
